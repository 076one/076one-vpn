# Optional CI build (the APK in out/ was built without it). Put the contents of src/ at the repo root.
name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK pieces
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build
        run: |
          BT=$ANDROID_SDK_ROOT/build-tools/34.0.0
          GO=$(which go) JAVA_HOME=$JAVA_HOME \
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar \
          AAPT2=$BT/aapt2 ZIPALIGN=$BT/zipalign D8_JAR=$BT/lib/d8.jar APKSIGNER_JAR=$BT/lib/apksigner.jar \
          OUT=$PWD/out bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: 076one-apk, path: out/076one-v1.1.apk }
